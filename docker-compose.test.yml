services:
  db-test:
    image: postgres:17
    container_name: my_finance_db_test
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=my_finance_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data