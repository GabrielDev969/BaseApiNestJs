global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: workspace-api

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: workspace-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          env: dev

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
